<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Centennial Eco-Kiosk Navigation & Booking</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <div class="booking-shell">
    <header class="booking-header">
      <div class="container topbar">
        <div class="brand-mark" aria-label="Centennial Eco-Kiosk brand">
          <span class="brand-icon">🌱</span>
          <span class="brand-text">Centennial Eco-Kiosk</span>
        </div>

        <nav class="utility-nav" aria-label="Utility menu">
          <button type="button" class="nav-pill nav-action">USD</button>
          <button type="button" class="nav-pill nav-action">EN</button>
          <button type="button" class="nav-pill nav-link">Help</button>
          <button type="button" class="nav-pill nav-outline">Sign in</button>
          <button type="button" class="nav-pill nav-primary">Register</button>
        </nav>
      </div>

      <div class="container hero-wrap">
        <div class="hero-copy">
          <p class="eyebrow">Campus access</p>
          <h1>🌱 Centennial Eco-Kiosk</h1>
          <p>Progress Campus — Real-time Room Directory & Seat Reservation</p>
        </div>
      </div>

      <div class="container search-shell-wrap">
        <div class="search-shell" aria-label="Search and booking filters">
          <div class="search-section">
            <span class="section-label">Location</span>
            <span class="section-value">Progress Campus</span>
          </div>
          <div class="search-section">
            <span class="section-label">Check-in</span>
            <span class="section-value">Today</span>
          </div>
          <div class="search-section">
            <span class="section-label">Guests</span>
            <span class="section-value">1 guest</span>
          </div>
          <button type="button" class="search-button">Search</button>
        </div>
      </div>
    </header>

    <main class="page-main container">
      <!-- Rooms will dynamically render here -->
      <div id="room-list" class="room-grid" aria-live="polite"></div>
    </main>
  </div>

  <!-- Reservation Modal -->
  <div class="modal-overlay" id="reservationModal">
    <div class="modal-card">
      <div class="modal-header">
        <h2 class="modal-title">Reserve a Study Seat</h2>
        <p class="modal-subtitle">Room Selection</p>
      </div>

      <form id="reservationForm" onsubmit="handleReservation(event)">
        <div class="form-group">
          <label class="form-label" for="duration">Duration</label>
          <select class="touch-select" id="duration" required>
            <option value="30">30 Minutes</option>
            <option value="60" selected>1 Hour</option>
            <option value="120">2 Hours</option>
          </select>
        </div>

        <div class="form-group">
          <label class="form-label" for="studentId">Student ID (Optional)</label>
          <input 
            type="text" 
            class="touch-input" 
            id="studentId" 
            placeholder="e.g. 301234567" 
            autocomplete="off"
          />
        </div>

        <div class="modal-actions">
          <button type="button" class="btn-action btn-cancel" onclick="closeModal()">Cancel</button>
          <button type="submit" class="btn-action btn-confirm">Confirm Spot</button>
        </div>
      </form>
    </div>
  </div>

  <script src="script.js"></script>
</body>
</html>
